# Render Blueprint for the TRACE API (apps/api). Optional — applying this
# (Render dashboard → New → Blueprint) provisions a Postgres database and a
# web service in one step; it does nothing until you do that. If you already
# created the web service by hand, you don't need this file — just match its
# Build/Start Command to what's below in the service's Settings tab.
#
# apps/web (Next.js) deploys separately, e.g. to Vercel — see vercel.json.
# apps/worker is a separate long-running process; add a `type: worker`
# service for it the same way once you need the background jobs it runs.

databases:
  - name: trace-db
    databaseName: trace
    user: trace
    plan: starter

services:
  - type: web
    name: trace-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm turbo run build --filter=@trace/api...
    # Migrations run once per deploy, before the new instance takes traffic.
    preDeployCommand: pnpm --filter @trace/db exec prisma migrate deploy
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trace-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      # Set these to your deployed web app's URL and this service's own
      # public URL (Render shows it after the first deploy) — CORS and
      # cookie/redirect correctness depend on both being right.
      - key: WEB_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
